[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "superstore-sales-and-profit-analytics"
version = "0.1.0"
description = "Business intelligence, SQL analytics, and Streamlit dashboard for the Superstore dataset."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Pontus Bjorkell" }
]

dependencies = [
    "pandas>=2.2,<3.0",
    "numpy>=1.26,<3.0",
    "matplotlib>=3.8,<4.0",
    "plotly>=5.20,<7.0",
    "streamlit>=1.36,<2.0",
    "scipy>=1.12,<2.0",
    "statsmodels>=0.14,<1.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0,<7.0"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"